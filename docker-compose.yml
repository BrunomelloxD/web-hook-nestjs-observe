# Development stack. Infra vars: root .env; app vars: apps/<app>/.env.
#
#   docker compose up --build
#   docker compose --profile mock up mock-api
#   docker compose --profile docs up storybook

x-database-url: &database-url postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-app}

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      # Picks up contract types regenerated on the host.
      - ./packages/api-client/src:/app/packages/api-client/src
    env_file:
      - apps/web/.env
    environment:
      API_URL: http://api:${API_PORT:-3333}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: sh -c "npx prisma generate && npm run start:dev"
    ports:
      - '${API_PORT:-3333}:${API_PORT:-3333}'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
    env_file:
      - apps/api/.env
    # Container network overrides.
    environment:
      PORT: ${API_PORT:-3333}
      DATABASE_URL: *database-url
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3000}
      # The web container always listens on 3000; WEB_PORT is only the host port.
      WEBHOOK_TARGET_URL: http://web:3000/webhooks/chat
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$$PORT/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: npx prisma migrate deploy
    volumes:
      - ./apps/api/prisma:/app/apps/api/prisma
    environment:
      DATABASE_URL: *database-url
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
    restart: 'no'

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ mounts here, not in /data.
      - postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - app-network

  # ---------- optional (profiles) ----------

  # Fake API from apps/api/openapi.json (run npm run generate first).
  mock-api:
    profiles: ['mock']
    image: stoplight/prism:5
    # The image crashes in multiprocess mode.
    command: mock -h 0.0.0.0 --multiprocess=false /spec/openapi.json
    ports:
      - '${MOCK_API_PORT:-4010}:4010'
    volumes:
      - ./apps/api/openapi.json:/spec/openapi.json:ro

  storybook:
    profiles: ['docs']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    command: npm run storybook -- --host 0.0.0.0 --no-open
    ports:
      - '${STORYBOOK_PORT:-6006}:6006'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/.storybook:/app/apps/web/.storybook

volumes:
  postgres:

networks:
  app-network:
    driver: bridge
